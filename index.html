<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090c">
<title>내 친구가 연락이 안돼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* 한밤중에 폰 화면 하나만 켜진 방. 가운데 좁은 단, 바깥은 어둠이 진행도에 따라 조여 온다. */
:root{
  --bg:#08090c;
  --ink:#c4c8ce;
  --dim:#5d636c;
  --glow:#e9eef5;
  --them:#1a1e24;
  --me:#26303b;
  --unread:#d9a441;
  --blood:#9e3a33;
  --serif:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --fs:19px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--unread);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- 시작 화면 ---------- */
#setup{max-width:560px;margin:0 auto;padding-block:12vh 64px;display:flex;flex-direction:column;gap:28px}
.lock{font-family:var(--sans);color:var(--dim);font-size:13px;letter-spacing:.08em;display:flex;justify-content:space-between}
.lock b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.2;margin:0;color:var(--glow);text-wrap:balance;letter-spacing:-.01em}
h1 .cursor{display:inline-block;width:.08em;height:.9em;background:var(--glow);vertical-align:-.08em;margin-left:.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notice{display:flex;gap:12px;align-items:center;background:var(--them);border-radius:16px;padding:14px 16px}
.notice .av{width:38px;height:38px;border-radius:50%;background:#2b3038;flex:none;display:grid;place-items:center;color:var(--dim);font-size:13px}
.notice .tx{min-width:0;flex:1}
.notice .nm{font-size:13px;color:var(--dim)}
.notice .last{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice .one{color:var(--unread);font-weight:500;font-size:13px}
textarea{width:100%;min-height:200px;resize:vertical;background:#0e1014;border:1px solid #1f242b;border-radius:12px;padding:14px 16px;line-height:1.8;font-family:var(--serif);font-size:15px}
textarea::placeholder{color:var(--dim)}
.hint{color:var(--dim);font-size:12.5px;margin:-16px 2px 0;line-height:1.6}
.hint code{font-family:var(--sans);color:var(--ink);background:#151920;border-radius:4px;padding:0 5px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:999px;padding:12px 20px;background:#151920;color:var(--ink);font-weight:500}
.btn:hover{background:#1c2129}
.btn.primary{background:var(--glow);color:#0b0d10}
.btn.primary:hover{background:#fff}
.btn.ghost{background:none;color:var(--dim);padding-inline:6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wear{color:var(--dim);font-size:12.5px;line-height:1.7}

/* ---------- 읽기 화면 ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:calc(2px + env(safe-area-inset-top,0px));z-index:30;pointer-events:none}
#bar i{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--glow);opacity:.55;transition:width .2s linear}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.3;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 40%,rgba(0,0,0,.92) 100%);transition:opacity 1.2s}
#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .9s}
#blackout.on{opacity:.94;transition:opacity .25s}
#reader{max-width:34em;margin:0 auto;padding-block:22vh 40vh;font-size:var(--fs)}
#story{display:flex;flex-direction:column;gap:1.5em}
.p{font-family:var(--serif);line-height:2.05;margin:0;word-break:keep-all;overflow-wrap:anywhere;
  opacity:.06;transform:translateY(10px);transition:opacity 1.4s ease,transform 1.4s ease,color 2s}
.p.seen{opacity:1;transform:none}
.p.quote{padding-left:1em;border-left:1px solid #2a2f37;color:var(--glow)}
.p.dread.seen{animation:shiver .5s 1}
.p.dread.hit{color:#e3c9c5}
@keyframes shiver{0%,100%{transform:none}20%{transform:translateX(-1.5px)}40%{transform:translateX(1.5px)}60%{transform:translateX(-1px)}80%{transform:translateX(.6px)}}
.brk{height:5em;display:grid;place-items:center;color:#2a2f37;font-size:.7em;letter-spacing:1.2em;padding-left:1.2em}

.msg{display:flex;flex-direction:column;gap:4px;max-width:78%;font-family:var(--sans);font-size:.86em;
  opacity:.06;transition:opacity .6s}
.msg.seen{opacity:1}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{color:var(--dim);font-size:.78em;padding-left:4px}
.msg .line{display:flex;align-items:flex-end;gap:6px}
.msg.me .line{flex-direction:row-reverse}
.bub{border-radius:18px;padding:.6em .95em;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.them .bub{background:var(--them);border-top-left-radius:6px;color:var(--glow)}
.me .bub{background:var(--me);border-top-right-radius:6px;color:var(--glow)}
.meta{font-size:.72em;color:var(--dim);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;font-variant-numeric:tabular-nums}
.them .meta{align-items:flex-start}
.meta .one{color:var(--unread);font-weight:500}
.typing{display:inline-flex;gap:4px;padding:.85em 1em}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.end{margin-top:5em;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dim);font-size:.8em;font-family:var(--sans)}
.end .one{color:var(--unread);font-weight:500;font-size:1.6em;font-variant-numeric:tabular-nums}

/* 알림 */
#notif{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;width:min(380px,calc(100% - 32px));
  transform:translate(-50%,-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
  background:rgba(28,32,39,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#notif.on{transform:translate(-50%,0)}
#notif .av{width:34px;height:34px;border-radius:9px;background:#2b3038;flex:none}
#notif .tx{min-width:0;flex:1;font-size:13px}
#notif .nm{color:var(--glow);font-weight:500;display:flex;justify-content:space-between}
#notif .nm small{color:var(--dim);font-weight:400}
#notif .bd{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 조작 */
#gear{position:fixed;z-index:35;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(26,30,36,.8);display:grid;place-items:center;opacity:.45;transition:opacity .3s}
#gear:hover,#gear[aria-expanded="true"]{opacity:1}
#gear svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}
#panel{position:fixed;z-index:35;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));
  width:min(280px,calc(100% - 32px));background:#12151a;border:1px solid #1f242b;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1a1e24}
.opt:last-child{border-bottom:0}
.opt label{font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;border:0;background:#2a2f37;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:#3d4a5a}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--glow)}
.step{display:flex;align-items:center;gap:2px;background:#1a1e24;border-radius:999px}
.step button{width:32px;height:30px;border:0;background:none;border-radius:999px;font-size:16px}
.step button:hover{background:#252a32}
.step output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.opt .btn{padding:8px 14px;font-size:13px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .p,.msg{opacity:1;transform:none}
}
</style>
</head>
<body>

<section id="setup" aria-labelledby="ttl">
  <div class="lock"><span>오전 <b id="clock">3:12</b></span><span>LTE ▂▄▆ 12%</span></div>
  <h1 id="ttl">내 친구가<br>연락이 안돼<span class="cursor" aria-hidden="true"></span></h1>

  <div class="notice" aria-hidden="true">
    <div class="av">친구</div>
    <div class="tx">
      <div class="nm">친구</div>
      <div class="last">야 괜찮아? 답장 좀</div>
    </div>
    <span class="one">1</span>
  </div>

  <textarea id="src" placeholder="읽을 글을 여기에 붙여 넣으세요." aria-label="읽을 글"></textarea>
  <p class="hint"><code>&gt;</code> 로 시작하는 줄은 받은 문자, <code>&lt;</code> 로 시작하는 줄은 보낸 문자로 보여요. <code>***</code> 는 장면 전환.</p>

  <div class="row">
    <button class="btn primary" id="go" type="button">읽기 시작</button>
    <button class="btn" id="resume" type="button" hidden>이어 읽기</button>
    <span class="btn filebtn">txt 파일 열기<input id="file" type="file" accept=".txt,text/plain" aria-label="txt 파일 열기"></span>
    <button class="btn ghost" id="sample" type="button">예시로 보기</button>
  </div>

  <p class="wear">불을 끄고, 이어폰을 끼고 읽는 걸 추천해요. 붙여 넣은 글은 이 브라우저에만 저장돼요.</p>
</section>

<div id="bar" hidden><i></i></div>
<div id="vignette" hidden></div>
<div id="blackout"></div>

<main id="reader" hidden>
  <article id="story"></article>
  <div class="end" id="end">
    <span class="one">1</span>
    <span>아직 읽지 않았습니다</span>
  </div>
</main>

<div id="notif" role="status" aria-live="polite">
  <div class="av"></div>
  <div class="tx"><div class="nm"><span id="nName">친구</span><small>지금</small></div><div class="bd" id="nBody"></div></div>
</div>

<button id="gear" type="button" aria-label="설정" aria-expanded="false" aria-controls="panel" hidden>
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div id="panel" hidden>
  <div class="opt"><label id="lSound">소리</label><button class="sw" id="optSound" role="switch" aria-labelledby="lSound" aria-checked="true" type="button"></button></div>
  <div class="opt"><label id="lAuto">자동 스크롤</label><button class="sw" id="optAuto" role="switch" aria-labelledby="lAuto" aria-checked="false" type="button"></button></div>
  <div class="opt"><label>속도</label><div class="step"><button type="button" data-k="speed" data-d="-1" aria-label="속도 낮추기">−</button><output id="vSpeed">2</output><button type="button" data-k="speed" data-d="1" aria-label="속도 높이기">+</button></div></div>
  <div class="opt"><label>글자 크기</label><div class="step"><button type="button" data-k="size" data-d="-1" aria-label="글자 작게">−</button><output id="vSize">3</output><button type="button" data-k="size" data-d="1" aria-label="글자 크게">+</button></div></div>
  <div class="opt"><label>다른 글</label><button class="btn" id="back" type="button">처음 화면</button></div>
</div>

<script>
(() => {
const K = { text: 'unreach-text-v1', pos: 'unreach-pos-v1', pref: 'unreach-pref-v1' };
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const $ = s => document.querySelector(s);

const SAMPLE = `(예시 문장이에요. 실제로 읽을 글은 처음 화면에 붙여 넣으세요.)

민수한테서 마지막으로 연락이 온 건 화요일 밤이었다.

> 야 너 혹시 지금 밖에 누구 있어?

< 아니 왜

> 아냐 그냥. 문 잠갔지?

그게 끝이었다. 그 뒤로 내가 보낸 메시지 옆의 1은 사흘째 지워지지 않았다.

***

오늘 새벽 세 시, 휴대폰이 울렸다. 민수였다.

> 문 열어줘

나는 대답하지 않았다. 현관문을 누군가 아주 천천히 두드리기 시작했다.`;

const SPEEDS = [10, 18, 28, 42, 60];
const SIZES = [16, 17.5, 19, 21, 23];
const pref = Object.assign({ sound: true, auto: false, speed: 2, size: 3 }, safeJSON(get(K.pref)));
function safeJSON(s) { try { return JSON.parse(s) || {}; } catch (e) { return {}; } }
const savePref = () => set(K.pref, JSON.stringify(pref));

/* ---------- 시계 ---------- */
(function clock() {
  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  $('.lock span').firstChild.textContent = (h < 12 ? '오전 ' : '오후 ');
  $('#clock').textContent = ((h % 12) || 12) + ':' + m;
})();

/* ---------- 글 해석 ---------- */
const DREAD = /(피가|피를|피투성이|죽었|죽은|죽어|시체|비명|감염|두드리|두드렸|노크|문 앞|누군가|숨소리|웃고 있|웃었다|사라졌|아무도 없|하지 마|도망|열어줘|열어 줘|살려)/;
const ME_NAMES = /^(나|me|Me|ME|OP|본인)$/;

function parse(raw) {
  const text = raw.replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const blocks = /\n[ \t]*\n/.test(text) ? text.split(/\n[ \t]*\n+/) : text.split('\n');
  const out = [];
  for (let b of blocks) {
    b = b.trim();
    if (!b) continue;
    if (/^([*＊\-─=~·.•]\s*){3,}$/.test(b)) { out.push({ t: 'brk' }); continue; }
    // 한 덩어리 안에 문자 줄이 여러 개면 각각 말풍선으로
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[<>]/.test(l))) {
      for (const l of lines) {
        const me = /^\s*</.test(l);
        out.push({ t: 'msg', who: me ? 'me' : 'them', name: '', body: l.replace(/^\s*[<>]\s?/, '') });
      }
      continue;
    }
    const sp = b.match(/^([^\s:：\[\]]{1,8})\s*[:：]\s+([\s\S]{1,240})$/);
    if (sp && !/[.!?]$/.test(sp[1])) {
      const me = ME_NAMES.test(sp[1]);
      out.push({ t: 'msg', who: me ? 'me' : 'them', name: me ? '' : sp[1], body: sp[2] });
      continue;
    }
    if (/^["“「『'‘][\s\S]*["”」』'’]$/.test(b)) { out.push({ t: 'p', quote: true, dread: DREAD.test(b), body: b }); continue; }
    out.push({ t: 'p', dread: DREAD.test(b), body: b });
  }
  return out;
}

/* ---------- 그리기 ---------- */
let clockMin = 0;
function fakeTime() {
  clockMin += 1 + Math.floor(Math.random() * 3);
  const base = 2 * 60 + 47 + clockMin;
  return '오전 ' + (Math.floor(base / 60) % 12 || 12) + ':' + String(base % 60).padStart(2, '0');
}

function render(items) {
  const story = $('#story');
  story.textContent = '';
  clockMin = 0;
  let lastName = '친구';
  items.forEach((it, i) => {
    let el;
    if (it.t === 'brk') {
      el = document.createElement('div'); el.className = 'brk'; el.textContent = '···'; el.setAttribute('aria-hidden', 'true');
    } else if (it.t === 'msg') {
      el = document.createElement('div');
      el.className = 'msg ' + it.who;
      if (it.name) lastName = it.name;
      if (it.who === 'them' && it.name) {
        const w = document.createElement('div'); w.className = 'who'; w.textContent = it.name; el.appendChild(w);
      }
      const line = document.createElement('div'); line.className = 'line';
      const bub = document.createElement('div'); bub.className = 'bub';
      bub.dataset.body = it.body;
      bub.textContent = it.body;
      const meta = document.createElement('div'); meta.className = 'meta';
      if (it.who === 'me') { const o = document.createElement('span'); o.className = 'one'; o.textContent = '1'; meta.appendChild(o); }
      const tm = document.createElement('span'); tm.textContent = fakeTime(); meta.appendChild(tm);
      line.append(bub, meta); el.appendChild(line);
      el.dataset.name = it.name || lastName;
    } else {
      el = document.createElement('p');
      el.className = 'p' + (it.quote ? ' quote' : '') + (it.dread ? ' dread' : '');
      el.textContent = it.body;
    }
    el.dataset.i = i;
    story.appendChild(el);
  });
}

/* ---------- 소리 (Web Audio로 직접 합성) ---------- */
const A = { ctx: null };
function audioInit() {
  if (A.ctx) { A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC(); A.ctx = ctx;
  A.master = ctx.createGain(); A.master.gain.value = pref.sound ? 1 : 0; A.master.connect(ctx.destination);
  // 낮게 깔리는 웅웅거림
  A.lp = ctx.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 140; A.lp.Q.value = 6;
  A.drone = ctx.createGain(); A.drone.gain.value = 0;
  A.lp.connect(A.drone); A.drone.connect(A.master);
  [43.65, 43.9, 65.4].forEach((f, i) => {
    const o = ctx.createOscillator(); o.type = i === 2 ? 'sine' : 'sawtooth'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = i === 2 ? .5 : .35; o.connect(g); g.connect(A.lp); o.start();
  });
  const lfo = ctx.createOscillator(); lfo.frequency.value = .07;
  const lg = ctx.createGain(); lg.gain.value = 45; lfo.connect(lg); lg.connect(A.lp.frequency); lfo.start();
  // 방 안 공기 소리
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  A.noiseBuf = buf;
  const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true;
  const ng = ctx.createGain(); ng.gain.value = .05; n.connect(ng); ng.connect(A.drone); n.start();
  A.drone.gain.linearRampToValueAtTime(.18, ctx.currentTime + 4);
}
function env(node, t, peak, a, r) {
  node.gain.setValueAtTime(0, t); node.gain.linearRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(.0001, t + a + r);
}
function ping() {
  if (!A.ctx || !pref.sound) return;
  const t = A.ctx.currentTime;
  [1318.5, 1760].forEach((f, i) => {
    const o = A.ctx.createOscillator(), g = A.ctx.createGain(); o.type = 'sine'; o.frequency.value = f;
    o.connect(g); g.connect(A.master); env(g, t + i * .09, .07, .005, .35); o.start(t + i * .09); o.stop(t + i * .09 + .5);
  });
}
function thud(strength = 1) {
  if (!A.ctx || !pref.sound) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t + .25);
  o.connect(g); g.connect(A.master); env(g, t, .55 * strength, .005, .4); o.start(t); o.stop(t + .5);
  const n = A.ctx.createBufferSource(); n.buffer = A.noiseBuf;
  const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
  const ng = A.ctx.createGain(); n.connect(f); f.connect(ng); ng.connect(A.master); env(ng, t, .5 * strength, .003, .18); n.start(t); n.stop(t + .3);
}
function knock() { thud(.8); setTimeout(() => thud(.7), 260); setTimeout(() => thud(.9), 520); }
function heartbeat() { thud(.35); setTimeout(() => thud(.25), 240); }
function duck(ms) {
  if (!A.ctx) return;
  const t = A.ctx.currentTime, g = A.drone.gain;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + .15);
  g.linearRampToValueAtTime(droneLevel(), t + ms / 1000 + 1.5);
}
const droneLevel = () => .14 + progress * .22;
let hbTimer = 0, hbLast = 0;
function tickHeart(now) {
  if (progress < .6 || !pref.sound || !A.ctx) return;
  const interval = 1500 - (progress - .6) / .4 * 700;
  if (now - hbLast > interval) { hbLast = now; heartbeat(); }
}

/* ---------- 읽기 진행 ---------- */
let progress = 0, items = [];
const notif = $('#notif');
let notifTimer = 0;
function showNotif(name, body) {
  $('#nName').textContent = name || '친구';
  $('#nBody').textContent = body;
  notif.classList.add('on');
  clearTimeout(notifTimer); notifTimer = setTimeout(() => notif.classList.remove('on'), 2600);
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const el = e.target; io.unobserve(el);
    reveal(el, true);
  }
}, { rootMargin: '0px 0px -22% 0px', threshold: .15 });

function reveal(el, live) {
  if (el.classList.contains('seen')) return;
  if (el.classList.contains('msg')) {
    const bub = el.querySelector('.bub');
    if (live) {
      const body = bub.dataset.body;
      bub.textContent = '';
      const ty = document.createElement('span'); ty.className = 'typing'; ty.innerHTML = '<span></span><span></span><span></span>';
      bub.appendChild(ty);
      el.classList.add('seen');
      const wait = Math.min(1600, 500 + body.length * 25);
      setTimeout(() => {
        bub.textContent = body;
        if (el.classList.contains('them')) {
          ping(); vibrate(40);
          if (window.scrollY > 0) showNotif(el.dataset.name, body);
          if (DREAD.test(body)) setTimeout(() => thud(.6), 400);
        }
      }, wait);
    } else el.classList.add('seen');
    return;
  }
  el.classList.add('seen');
  if (!live) return;
  if (el.classList.contains('brk')) {
    const bo = $('#blackout'); bo.classList.add('on'); duck(1400);
    setTimeout(() => bo.classList.remove('on'), 1300);
  } else if (el.classList.contains('dread')) {
    const txt = el.textContent;
    if (/두드리|두드렸|노크/.test(txt)) knock(); else thud(.7);
    vibrate([30, 60, 30]);
    setTimeout(() => el.classList.add('hit'), 200);
  }
}

function onScroll() {
  const r = $('#story').getBoundingClientRect();
  const total = r.height - innerHeight * .5;
  progress = Math.max(0, Math.min(1, (innerHeight * .5 - r.top) / Math.max(1, total)));
  $('#bar i').style.width = (progress * 100) + '%';
  $('#vignette').style.opacity = (.3 + progress * .6).toFixed(3);
  if (A.ctx) {
    A.lp.frequency.setTargetAtTime(140 + progress * 120, A.ctx.currentTime, .8);
    if (!$('#blackout').classList.contains('on')) A.drone.gain.setTargetAtTime(droneLevel(), A.ctx.currentTime, 1.2);
  }
  clearTimeout(onScroll.t);
  onScroll.t = setTimeout(() => set(K.pos, String(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight))), 300);
}

/* 자동 스크롤 */
let lastT = 0, pauseUntil = 0, carry = 0;
function loop(t) {
  const dt = lastT ? Math.min(.1, (t - lastT) / 1000) : 0; lastT = t;
  if (pref.auto && !$('#reader').hidden && t > pauseUntil) {
    carry += SPEEDS[pref.speed - 1] * dt;
    if (carry >= 1) { const px = Math.floor(carry); carry -= px; scrollBy(0, px); }
  }
  if (!$('#reader').hidden) tickHeart(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, e => {
  if (ev === 'keydown' && e.key === ' ') return;
  pauseUntil = performance.now() + 2500;
}, { passive: true }));

/* ---------- 화면 전환 ---------- */
function startReading(raw, resume) {
  items = parse(raw);
  if (!items.length) { $('#src').focus(); return; }
  render(items);
  audioInit();
  $('#setup').hidden = true;
  ['#reader', '#bar', '#vignette', '#gear'].forEach(s => $(s).hidden = false);
  document.body.style.cursor = '';
  const els = [...$('#story').children];
  let startY = 0;
  if (resume) {
    const r = parseFloat(get(K.pos)) || 0;
    startY = r * (document.documentElement.scrollHeight - innerHeight);
  }
  scrollTo(0, startY);
  // 이미 지나온 부분과 지금 화면에 보이는 부분은 바로 보이게
  requestAnimationFrame(() => {
    const limit = innerHeight * .78;
    els.forEach(el => {
      const top = el.getBoundingClientRect().top;
      if (top < limit) reveal(el, false); else io.observe(el);
    });
    onScroll();
  });
}
function backToSetup() {
  io.disconnect();
  ['#reader', '#bar', '#vignette', '#gear', '#panel'].forEach(s => $(s).hidden = true);
  $('#gear').setAttribute('aria-expanded', 'false');
  $('#setup').hidden = false;
  if (A.ctx) A.drone.gain.setTargetAtTime(0, A.ctx.currentTime, .4);
  pref.auto = false; syncPanel(); savePref();
  scrollTo(0, 0);
  refreshResume();
}
function refreshResume() {
  const saved = get(K.text), pos = parseFloat(get(K.pos)) || 0;
  const btn = $('#resume');
  btn.hidden = !(saved && pos > .02 && pos < .98);
  btn.textContent = '이어 읽기 ' + Math.round(pos * 100) + '%';
}

const src = $('#src');
src.value = get(K.text) || '';
refreshResume();
src.addEventListener('input', () => { set(K.text, src.value); });
$('#go').addEventListener('click', () => {
  if (!src.value.trim()) { src.focus(); src.placeholder = '먼저 글을 붙여 넣어 주세요.'; return; }
  set(K.text, src.value); set(K.pos, '0'); startReading(src.value, false);
});
$('#resume').addEventListener('click', () => startReading(get(K.text) || src.value, true));
$('#sample').addEventListener('click', () => startReading(SAMPLE, false));
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let t = String(rd.result);
    if (t.includes('�')) { // UTF-8이 아니면 EUC-KR로 다시
      const r2 = new FileReader(); r2.onload = () => { src.value = r2.result; set(K.text, src.value); }; r2.readAsText(f, 'euc-kr'); return;
    }
    src.value = t; set(K.text, t);
  };
  rd.readAsText(f, 'utf-8');
  e.target.value = '';
});
$('#back').addEventListener('click', backToSetup);
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onScroll);

/* ---------- 설정 패널 ---------- */
const panel = $('#panel'), gear = $('#gear');
gear.addEventListener('click', () => { panel.hidden = !panel.hidden; gear.setAttribute('aria-expanded', String(!panel.hidden)); });
function syncPanel() {
  $('#optSound').setAttribute('aria-checked', String(pref.sound));
  $('#optAuto').setAttribute('aria-checked', String(pref.auto));
  $('#vSpeed').textContent = pref.speed;
  $('#vSize').textContent = pref.size;
  document.documentElement.style.setProperty('--fs', SIZES[pref.size - 1] + 'px');
  if (A.ctx) A.master.gain.setTargetAtTime(pref.sound ? 1 : 0, A.ctx.currentTime, .1);
}
$('#optSound').addEventListener('click', () => { pref.sound = !pref.sound; syncPanel(); savePref(); });
$('#optAuto').addEventListener('click', () => { pref.auto = !pref.auto; pauseUntil = 0; syncPanel(); savePref(); });
panel.querySelectorAll('.step button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.k, max = k === 'speed' ? SPEEDS.length : SIZES.length;
  pref[k] = Math.max(1, Math.min(max, pref[k] + Number(b.dataset.d)));
  syncPanel(); savePref();
}));
addEventListener('keydown', e => {
  if ($('#reader').hidden || e.target.closest('textarea')) return;
  if (e.key === ' ') { e.preventDefault(); pref.auto = !pref.auto; pauseUntil = 0; syncPanel(); savePref(); }
  if (e.key === 'Escape') { panel.hidden = true; gear.setAttribute('aria-expanded', 'false'); }
});
syncPanel();
})();
</script>
</body>
