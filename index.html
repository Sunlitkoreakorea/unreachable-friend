<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080a">
<title>내 친구가 연락이 안돼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* 새벽 3시 폰 화면 하나. 가운데 좁은 단, 읽을수록 바깥 어둠과 곰팡이 줄기가 화면 가장자리를 먹어 들어온다. */
:root{
  --bg:#07080a;
  --ink:#c3c7cd;
  --dim:#5a6069;
  --glow:#e8edf4;
  --them:#191d23;
  --me:#25303b;
  --unread:#d9a441;
  --rot:#3c4a3a;
  --alarm:#a3342c;
  --serif:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --fs:19px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dim)}
:focus-visible{outline:2px solid var(--unread);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- 잠금 화면 ---------- */
#cover{max-width:440px;margin:0 auto;padding-block:9vh 56px;display:flex;flex-direction:column;gap:26px}
.clock{text-align:center;color:var(--glow);font-family:var(--sans)}
.clock .t{font-size:clamp(64px,20vw,88px);font-weight:400;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{color:var(--dim);font-size:14px;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.nt{background:rgba(30,34,41,.82);border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:center}
.nt .ic{width:34px;height:34px;border-radius:10px;background:#2a2f37;flex:none;display:grid;place-items:center;font-size:12px;color:var(--ink)}
.nt .tx{min-width:0;flex:1}
.nt .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--glow);font-weight:500}
.nt .hd small{color:var(--dim);font-weight:400}
.nt .bd{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack .nt:nth-child(2){opacity:.7;transform:scale(.97)}
.stack .nt:nth-child(3){opacity:.4;transform:scale(.94)}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.25;margin:10px 0 0;color:var(--glow);text-align:center;text-wrap:balance}
.sub{text-align:center;color:var(--dim);font-size:13px;margin:-14px 0 0}
.cast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:13px;border-top:1px solid #171b21;border-bottom:1px solid #171b21;padding-block:14px}
.cast div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.cast b{font-weight:500;color:var(--glow)}
.cast span{color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:999px;padding:14px 20px;background:#151920;color:var(--ink);font-weight:500;position:relative;overflow:hidden;text-align:center}
.btn:hover{background:#1c2129}
.btn.primary{background:var(--glow);color:#0a0c0f}
.btn.primary:hover{background:#fff}
.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wear{color:var(--dim);font-size:12.5px;line-height:1.7;text-align:center;margin:0}
.err{color:#e08b83;font-size:13px;text-align:center;margin:0}

/* ---------- 읽기 ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:calc(2px + env(safe-area-inset-top,0px));z-index:30;pointer-events:none}
#bar i{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--glow);opacity:.5}
#mold{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:18}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:.3;
  background:radial-gradient(ellipse 72% 62% at 50% 45%,transparent 38%,rgba(0,0,0,.93) 100%);transition:opacity 1.2s}
#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity 1s}
#blackout.on{opacity:.96;transition:opacity .3s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:26;background:var(--alarm);mix-blend-mode:multiply;opacity:0}
#flash.on{animation:redflash .5s steps(2) 1}
@keyframes redflash{0%{opacity:.55}50%{opacity:0}75%{opacity:.35}100%{opacity:0}}

#reader{max-width:34em;margin:0 auto;padding-block:16vh 30vh;font-size:var(--fs);position:relative;z-index:1}
#story{display:flex;flex-direction:column;gap:1.4em}
.ch{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.6em;text-align:center}
.ch .n{font-family:var(--sans);font-size:.7em;letter-spacing:.3em;color:var(--dim);padding-left:.3em}
.ch h2{font-family:var(--serif);font-weight:800;font-size:1.5em;color:var(--glow);margin:0;text-wrap:balance}
.ch .rule{width:1px;height:3em;background:linear-gradient(var(--dim),transparent);margin-top:.6em}

.p{font-family:var(--serif);line-height:2.05;margin:0;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;
  opacity:.06;transform:translateY(10px);transition:opacity 1.3s ease,transform 1.3s ease,color 2s}
.p.seen{opacity:1;transform:none}
.p.hit{color:#dccbc7}
.p.shake{animation:shiver .5s 1}
@keyframes shiver{0%,100%{transform:none}20%{transform:translateX(-1.5px)}40%{transform:translateX(1.5px)}60%{transform:translateX(-1px)}80%{transform:translateX(.6px)}}
.note{font-family:var(--sans);font-size:.78em;color:var(--dim);line-height:1.8;text-align:center;max-width:30em;align-self:center;white-space:pre-line;word-break:keep-all;
  opacity:.06;transition:opacity 1s}
.note.seen{opacity:1}

.msg{display:flex;flex-direction:column;gap:4px;max-width:80%;font-family:var(--sans);font-size:.86em;opacity:.06;transition:opacity .5s}
.msg.seen{opacity:1}
.msg+.msg{margin-top:-.8em}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{color:var(--dim);font-size:.78em;padding-inline:4px}
.msg .line{display:flex;align-items:flex-end;gap:6px}
.msg.me .line{flex-direction:row-reverse}
.bub{border-radius:18px;padding:.6em .95em;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:var(--glow)}
.them .bub{background:var(--them);border-top-left-radius:6px}
.me .bub{background:var(--me);border-top-right-radius:6px}
.one{font-size:.72em;color:var(--unread);font-weight:500;font-variant-numeric:tabular-nums}
.msg.come .bub{animation:come .6s 1}
@keyframes come{0%{transform:none;color:var(--glow)}15%{transform:translateX(-3px);color:#ff9c90;text-shadow:2px 0 rgba(255,40,40,.6),-2px 0 rgba(40,200,255,.4)}35%{transform:translateX(3px)}55%{transform:translateX(-2px)}100%{transform:none}}
.typing{display:inline-flex;gap:4px;padding:.25em .1em}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}

figure{margin:.6em 0;display:flex;flex-direction:column;gap:8px;align-items:center;opacity:.06;transition:opacity .4s}
figure.seen{opacity:1}
figure img{display:block;max-width:100%;max-height:78vh;border-radius:4px;cursor:zoom-in;background:#0d0f12}
figure.seen img{animation:develop 2.4s ease-out 1}
@keyframes develop{0%{filter:brightness(0) contrast(2)}8%{filter:brightness(1.8) contrast(1.4)}12%{filter:brightness(.1)}30%{filter:brightness(.5) contrast(1.3)}100%{filter:none}}
figure figcaption{font-size:.72em;color:var(--dim);font-family:var(--sans)}
.gone{width:min(100%,360px);aspect-ratio:4/3;display:grid;place-items:center;background:#0d0f12;border:1px dashed #262b33;border-radius:4px;color:var(--dim);font-size:.78em;font-family:var(--sans);text-align:center;padding:16px}

.glitch .p,.glitch.p{animation:jit 3.2s infinite steps(1)}
@keyframes jit{0%,92%,100%{text-shadow:none;transform:none}93%{text-shadow:2px 0 rgba(255,50,50,.55),-2px 0 rgba(60,200,255,.45);transform:translateX(1px)}96%{text-shadow:-1px 0 rgba(255,50,50,.5);transform:translateX(-1px)}}

.end{margin-top:6em;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dim);font-size:.8em;font-family:var(--sans)}
.end .one{font-size:2em}
.end button{margin-top:1.4em;background:none;border:1px solid #232830;border-radius:999px;padding:10px 18px;color:var(--ink)}

/* 알림 */
#notif{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;width:min(380px,calc(100% - 32px));
  transform:translate(-50%,-150%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
  background:rgba(28,32,39,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#notif.on{transform:translate(-50%,0)}
#notif .ic{width:34px;height:34px;border-radius:10px;background:#2a2f37;flex:none;display:grid;place-items:center;font-size:12px}
#notif .tx{min-width:0;flex:1;font-size:13px}
#notif .hd{color:var(--glow);font-weight:500;display:flex;justify-content:space-between}
#notif .hd small{color:var(--dim);font-weight:400}
#notif .bd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 사진 크게 보기 */
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* 설정 */
#gear{position:fixed;z-index:35;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(26,30,36,.85);display:grid;place-items:center;opacity:.45;transition:opacity .3s}
#gear:hover,#gear[aria-expanded="true"]{opacity:1}
#gear svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}
#panel{position:fixed;z-index:35;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));
  width:min(290px,calc(100% - 32px));max-height:calc(100% - 100px);overflow:auto;background:#111418;border:1px solid #1f242b;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1a1e24}
.opt label{font-size:14px}
.sw{width:44px;height:26px;border-radius:13px;border:0;background:#2a2f37;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:#3d4a5a}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--glow)}
.step{display:flex;align-items:center;gap:2px;background:#1a1e24;border-radius:999px}
.step button{width:32px;height:30px;border:0;background:none;border-radius:999px;font-size:16px}
.step button:hover{background:#252a32}
.step output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.chaps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 0 8px}
.chaps button{border:0;border-radius:10px;background:#1a1e24;padding:9px 0;font-size:13px;font-variant-numeric:tabular-nums}
.chaps button:hover{background:#252a32}
.chaps button.cur{background:var(--glow);color:#0a0c0f}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .p,.msg,.note,figure{opacity:1;transform:none}
}
</style>
</head>
<body>

<section id="cover">
  <div class="clock"><div class="t" id="cTime">3:03</div><div class="d" id="cDate"></div></div>
  <div class="stack" aria-hidden="true">
    <div class="nt"><div class="ic">D</div><div class="tx"><div class="hd">Dean<small>지금</small></div><div class="bd">이리와.</div></div></div>
    <div class="nt"><div class="ic">D</div><div class="tx"><div class="hd">Dean<small>2분 전</small></div><div class="bd">이리와.</div></div></div>
    <div class="nt"><div class="ic">D</div><div class="tx"><div class="hd">Dean<small>5분 전</small></div><div class="bd">이리와.</div></div></div>
  </div>
  <h1>내 친구가<br>연락이 안돼</h1>

  <div class="cast" id="cast" hidden></div>
  <div class="actions">
    <button class="btn primary" id="go" type="button" hidden>읽기 시작</button>

  </div>
  <p class="err" id="err" hidden></p>
  <p class="wear" id="wear">불 끄고 이어폰 끼고 읽기</p>
</section>

<div id="bar" hidden><i></i></div>
<canvas id="mold" hidden></canvas>
<div id="vignette" hidden></div>
<div id="blackout"></div>
<div id="flash"></div>

<main id="reader" hidden>
  <article id="story"></article>
  <div class="end">

</main>

<div id="notif" role="status" aria-live="polite">

</div>
<div id="lightbox" hidden><img alt="" id="lbImg"></div>

<button id="gear" type="button" aria-label="설정" aria-expanded="false" aria-controls="panel" hidden>
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div id="panel" hidden>
  <div class="chaps" id="chaps"></div>
  <div class="opt"><label id="lSound">소리</label><button class="sw" id="optSound" role="switch" aria-labelledby="lSound" aria-checked="true" type="button"></button></div>
  <div class="opt"><label id="lAuto">자동 스크롤</label><button class="sw" id="optAuto" role="switch" aria-labelledby="lAuto" aria-checked="false" type="button"></button></div>
  <div class="opt"><label>속도</label><div class="step"><button type="button" data-k="speed" data-d="-1" aria-label="느리게">−</button><output id="vSpeed">2</output><button type="button" data-k="speed" data-d="1" aria-label="빠르게">+</button></div></div>
  <div class="opt" style="border-bottom:0"><label>글자 크기</label><div class="step"><button type="button" data-k="size" data-d="-1" aria-label="작게">−</button><output id="vSize">3</output><button type="button" data-k="size" data-d="1" aria-label="크게">+</button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const K = { pos: 'unreach-pos-v2', pref: 'unreach-pref-v2' };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const pref = Object.assign({ sound: true, auto: false, speed: 2, size: 3 }, (() => { try { return JSON.parse(lsGet(K.pref)) || {}; } catch (e) { return {}; } })());
const savePref = () => lsSet(K.pref, JSON.stringify(pref));
const SPEEDS = [10, 18, 28, 42, 60], SIZES = [16, 17.5, 19, 21, 23];

/* 잠금 화면 시계 */
(function () {
  const d = new Date();
  $('#cTime').textContent = ((d.getHours() % 12) || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  $('#cDate').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'[d.getDay()] + '요일';
})();

/* ---------- docx 보관 (IndexedDB) ---------- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('unreach', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbPut(buf) { try { const db = await idb(); db.transaction('f', 'readwrite').objectStore('f').put(buf, 'docx'); } catch (e) {} }
async function idbGet() {
  try {
    const db = await idb();
    return await new Promise(res => { const q = db.transaction('f').objectStore('f').get('docx'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  } catch (e) { return null; }
}

/* ---------- docx 읽기 ---------- */
// 편 시작 문장 (앞부분만 대조)
const CHAPTERS = [
  { n: '1', t: '내 친구가 연락이 안돼', at: /^\[\s*내 친구가 연락이 안돼\s*\]$/ },
  { n: '2', t: '아무도 없는 338호', at: /^안녕 nosleep\. 조언해준/ },
  { n: '3', t: 'Sam의 휴대폰', at: /^아\.\. 오늘은 진짜 너무너무/ },
  { n: '4', t: '이리와', at: /^하\.\. 내가 처음부터 이 일에/ },
  { n: '5', t: '침대 밑', at: /^“?Cas”?가 자기 진짜 이름이/ },
  { n: '6', t: 'Alex', at: /^모두들 안녕\. 나Alex야/ },
  { n: '7', t: '로비', at: /^안녕 다시 Jess야/ },
  { n: '8', t: '지하실', at: /^오늘은 진짜 내 인생 최악의 밤/ },
  { n: '마지막', t: '', at: /^너무 적정하/ },
];
// docx에 빠진 사진 (원래 imgur 앨범 / 삭제된 사진)
const MISSING = {
  'L6M3W': { src: 'https://i.imgur.com/rtgFJwG.jpeg', link: 'https://imgur.com/a/L6M3W', cap: '앨범 첫 장만 남아 있어요' },
  'UQlVB': { gone: '이 사진은 삭제되었습니다' },
};
const SPEAKER = /^(나\s*\(Alex\)|나|Dean|Sam|D|S)\s*[:：]\s?(.*)$/;
// 1편 초반 순화 (줄 전체가 같을 때만 바꿈, 오타 연출은 유지)
const SOFTEN = {

async function readDocx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file('word/document.xml').async('string');
  const relsXml = await zip.file('word/_rels/document.xml.rels').async('string');
  const rels = {};
  for (const m of relsXml.matchAll(/Id="(rId\d+)"[^>]*?Target="([^"]+)"/g)) rels[m[1]] = m[2];
  for (const m of relsXml.matchAll(/Target="([^"]+)"[^>]*?Id="(rId\d+)"/g)) rels[m[2]] = m[1];
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const body = doc.getElementsByTagName('w:body')[0];
  const paras = [];
  for (const p of body.getElementsByTagName('w:p')) {
    let text = ''; const imgs = [];
    const walk = n => {
      for (const c of n.childNodes) {
        if (c.nodeType !== 1) continue;
        const nm = c.nodeName;
        if (nm === 'w:t') text += c.textContent;
        else if (nm === 'w:br' || nm === 'w:cr') text += '\n';
        else if (nm === 'w:tab') text += ' ';
        else if (nm === 'a:blip') { const id = c.getAttribute('r:embed'); if (id) imgs.push(id); }
        else walk(c);
      }
    };
    walk(p);
    paras.push({ text, imgs });
  }
  const media = {};
  for (const p of paras) for (const id of p.imgs) {
    const target = rels[id]; if (!target || media[id]) continue;
    const f = zip.file('word/' + target.replace(/^\/?word\//, ''));
    if (!f) continue;
    const blob = await f.async('blob');
    media[id] = { size: blob.size, url: blob.size > 1024 ? URL.createObjectURL(new Blob([blob], { type: /png$/i.test(target) ? 'image/png' : 'image/jpeg' })) : null };
  }
  return build(paras, media);
}

function build(paras, media) {
  // 문단과 줄바꿈을 한 줄씩 풀어서 순서대로
  const lines = [];
  for (const p of paras) {
    for (const l of p.text.split('\n')) lines.push({ t: 'line', s: l.trim() });
    for (const id of p.imgs) lines.push({ t: 'img', id });
    lines.push({ t: 'line', s: '' });
  }
  const cast = [], blocks = [];
  // 등장인물 (맨 앞 표지 제목 다음에 있음)
  let i = lines.findIndex(L => L.s === '등장인물');
  if (i >= 0) { for (i++; i < lines.length && lines[i].s; i++) { const m = lines[i].s.split(/\s*-\s*/); cast.push([m[0], m[1] || '']); } }
  else i = 0;
  const first = lines.findIndex((L, k) => k >= i && L.s && CHAPTERS[0].at.test(L.s));
  if (first >= 0) i = first;
  let ch = -1, lastUrl = '', prose = null, lastMsg = null, gapSinceMsg = true;
  const flush = () => { if (prose) { blocks.push(prose); prose = null; } };
  for (; i < lines.length; i++) {
    const L = lines[i];
    if (L.t === 'img') {
      flush(); lastMsg = null;
      const m = media[L.id];
      const key = (lastUrl.match(/imgur\.com\/(?:r\/\w+\/|a\/)?(\w+)/) || [])[1];
      if (m && m.url) blocks.push({ t: 'img', src: m.url, ch });
      else if (key && MISSING[key]) blocks.push(Object.assign({ t: 'img', ch }, MISSING[key]));
      continue;
    }
    const s = SOFTEN[L.s] || L.s;
    if (!s) { flush(); gapSinceMsg = true; continue; }
    const nc = CHAPTERS.findIndex((c, k) => k > ch && c.at.test(s));
    if (nc >= 0) {
      flush(); lastMsg = null; ch = nc;
      blocks.push({ t: 'ch', ch });
      if (nc === 0) continue; // 제목 줄은 머리글로 대신
    }
    if (/={5,}\s*$/.test(s)) continue;           // "내 친구가 연락이 안돼(2)=====" 같은 구분 줄
    if (/^↓/.test(s) || /^https?:\/\//.test(s)) { lastUrl = s; continue; }
    const sp = s.match(SPEAKER);
    if (sp) {
      flush();
      const raw = sp[1].replace(/\s/g, '');
      const who = raw === 'D' ? 'Dean' : raw === 'S' ? 'Sam' : raw;
      lastMsg = { t: 'msg', who, me: who.startsWith('나'), body: sp[2], ch };
      blocks.push(lastMsg); gapSinceMsg = false; continue;
    }
    if (lastMsg && !gapSinceMsg && s.length < 60 && !/^\[/.test(s)) { lastMsg.body += '\n' + s; continue; }
    lastMsg = null;
    if (/^\[[\s\S]*\]$/.test(s)) { flush(); blocks.push({ t: 'note', body: s.slice(1, -1).trim(), ch }); continue; }
    if (!prose) prose = { t: 'p', body: s, ch }; else prose.body += '\n' + s;
  }
  flush();
  return { cast, blocks };
}

  if (A.ctx) {
    A.lp.frequency.setTargetAtTime(140 + progress * 130, A.ctx.currentTime, .8);
    if (!$('#blackout').classList.contains('on')) A.drone.gain.setTargetAtTime(droneLevel(), A.ctx.currentTime, 1.2);
  }
  clearTimeout(onScroll.t);
  onScroll.t = setTimeout(() => {
    const top = blockEls.find(el => el.getBoundingClientRect().bottom > innerHeight * .2);
    if (top) lsSet(K.pos, JSON.stringify({ i: +top.dataset.i, p: progress }));
  }, 400);
}
function markChap() { [...$('#chaps').children].forEach((b, j) => b.classList.toggle('cur', j === curCh)); }
function jumpTo(el) {
  const els = blockEls, idx = els.indexOf(el);
  els.forEach((e, j) => { if (j < idx) { io.unobserve(e); reveal(e, false); } });
  el.scrollIntoView({ block: 'start' });
  scrollBy(0, -innerHeight * .1);
  $('#panel').hidden = true; $('#gear').setAttribute('aria-expanded', 'false');
}

/* 자동 스크롤 + 심장 소리 */
let lastT = 0, pauseUntil = 0, carry = 0, hbLast = 0;
function loop(t) {
  const dt = lastT ? Math.min(.1, (t - lastT) / 1000) : 0; lastT = t;
  if (!$('#reader').hidden) {
    if (pref.auto && t > pauseUntil && $('#lightbox').hidden) { carry += SPEEDS[pref.speed - 1] * dt; if (carry >= 1) { const px = Math.floor(carry); carry -= px; scrollBy(0, px); } }
    if (progress > .7 && on()) { const iv = 1500 - (progress - .7) / .3 * 700; if (t - hbLast > iv) { hbLast = t; heartbeat(); } }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
['wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { pauseUntil = performance.now() + 2500; }, { passive: true }));

/* ---------- 화면 전환 ---------- */
function start(resume) {
  audioInit();
  $('#cover').hidden = true;
  ['#reader', '#bar', '#vignette', '#gear', '#mold'].forEach(s => $(s).hidden = false);
  render(); moldInit();
  let target = null;
  if (resume) { try { const s = JSON.parse(lsGet(K.pos)); target = blockEls[s.i]; } catch (e) {} }
  const ti = target ? blockEls.indexOf(target) : -1;
  blockEls.forEach((el, j) => { if (j < ti) reveal(el, false); });
  if (target) { target.scrollIntoView({ block: 'start' }); scrollBy(0, -innerHeight * .2); } else scrollTo(0, 0);
  requestAnimationFrame(() => {
    blockEls.forEach(el => { if (el.classList.contains('seen')) return; if (el.getBoundingClientRect().top < innerHeight * .76) reveal(el, false); else io.observe(el); });
    onScroll(); markChap();
  });
}
function toCover() {
  io.disconnect();
  ['#reader', '#bar', '#vignette', '#gear', '#panel', '#mold'].forEach(s => $(s).hidden = true);
  $('#cover').hidden = false; scrollTo(0, 0);
  if (A.ctx) A.drone.gain.setTargetAtTime(0, A.ctx.currentTime, .4);
  lsSet(K.pos, ''); refreshCover();
}
function refreshCover() {
  const ready = !!STORY;
  $('#go').hidden = !ready; $('#openWrap').hidden = ready;
  let s = null; try { s = JSON.parse(lsGet(K.pos)); } catch (e) {}
  const r = $('#resume');
  r.hidden = !(ready && s && s.p > .01 && s.p < .985);
  if (!r.hidden) r.textContent = '이어 읽기 · ' + Math.round(s.p * 100) + '%';
  $('#go').textContent = r.hidden ? '읽기 시작' : '처음부터';
  $('#go').classList.toggle('primary', r.hidden); r.classList.toggle('primary', !r.hidden);
  const cast = $('#cast');
  if (ready && STORY.cast.length) {
    cast.textContent = '';
    for (const [n, role] of STORY.cast) { const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = n; const sp = document.createElement('span'); sp.textContent = role; d.append(b, sp); cast.appendChild(d); }
    cast.hidden = false;
  }
  $('#wear').textContent = ready ? '불 끄고 이어폰 끼고 읽기' : '처음 한 번만 docx를 열면 이 브라우저가 기억해요';
}
async function load(buf, save) {
  try {
    STORY = await readDocx(buf);
    if (!STORY.blocks.length) throw new Error('empty');
    if (save) idbPut(buf);
    $('#err').hidden = true;
  } catch (e) {
    STORY = null; $('#err').textContent = '이 파일을 읽지 못했어요. 「내 친구가 연락이 안돼」 docx 파일인지 확인해 주세요.'; $('#err').hidden = false;
  }
  refreshCover();
}

$('#go').addEventListener('click', () => { lsSet(K.pos, ''); start(false); });
$('#resume').addEventListener('click', () => start(true));
$('#again').addEventListener('click', toCover);
$('#file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await load(await f.arrayBuffer(), true); e.target.value = ''; });
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', () => { if (!$('#reader').hidden) { moldInit(); onScroll(); } });
$('#story').addEventListener('click', e => { const im = e.target.closest('figure img'); if (!im) return; $('#lbImg').src = im.src; $('#lightbox').hidden = false; });
$('#lightbox').addEventListener('click', () => { $('#lightbox').hidden = true; });

/* 설정 */
const panel = $('#panel'), gear = $('#gear');
gear.addEventListener('click', () => { panel.hidden = !panel.hidden; gear.setAttribute('aria-expanded', String(!panel.hidden)); });
function syncPanel() {
  $('#optSound').setAttribute('aria-checked', String(pref.sound));
  $('#optAuto').setAttribute('aria-checked', String(pref.auto));
  $('#vSpeed').textContent = pref.speed; $('#vSize').textContent = pref.size;
  document.documentElement.style.setProperty('--fs', SIZES[pref.size - 1] + 'px');
  if (A.ctx) A.master.gain.setTargetAtTime(pref.sound ? 1 : 0, A.ctx.currentTime, .1);
}
$('#optSound').addEventListener('click', () => { pref.sound = !pref.sound; syncPanel(); savePref(); });
$('#optAuto').addEventListener('click', () => { pref.auto = !pref.auto; pauseUntil = 0; syncPanel(); savePref(); });
panel.querySelectorAll('.step button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.k, max = k === 'speed' ? SPEEDS.length : SIZES.length;
  pref[k] = Math.max(1, Math.min(max, pref[k] + Number(b.dataset.d))); syncPanel(); savePref();
}));
addEventListener('keydown', e => {
  if ($('#reader').hidden) return;
  if (e.key === ' ') { e.preventDefault(); pref.auto = !pref.auto; pauseUntil = 0; syncPanel(); savePref(); }
  else if (e.key === 'Escape') { panel.hidden = true; gear.setAttribute('aria-expanded', 'false'); $('#lightbox').hidden = true; }
  else pauseUntil = performance.now() + 2500;
});
syncPanel();

/* 시작: 같은 폴더의 story.docx → 저장해 둔 파일 → 직접 열기 */
(async () => {
  refreshCover();
  if (window.EMBED_DOCX) { // 내 컴퓨터용 단독 파일: docx가 파일 안에 들어 있음
    const bin = atob(window.EMBED_DOCX), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    await load(u8.buffer, false); return;
  }
  try { const r = await fetch('story.docx', { cache: 'no-store' }); if (r.ok) { await load(await r.arrayBuffer(), false); return; } } catch (e) {}
  const saved = await idbGet(); if (saved) await load(saved, false);
})();
})();
</script>
</body>
